<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>New Bern Collection — Downtown Raleigh</title>
  <meta name="description" content="New Bern Collection — Live, work and play in Downtown Raleigh." />
  <meta property="og:title" content="New Bern Collection" />
  <meta property="og:description" content="Live, work and play in Downtown Raleigh." />
  <meta property="og:url" content="https://newberncollection.com" />
  <meta name="twitter:card" content="summary" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0b0c0e;
      --gold: #D99B26;
      --gold-glow: rgba(217, 155, 38, 0.32);
      --green: #244033;
      --text: #ffffff;
      --text-muted: #9aa0a6;
      --text-dim: #5f6368;
      --orbit-line: rgba(255, 255, 255, 0.08);
      --node-active-bg: rgba(255, 255, 255, 0.06);
      --node-active-border: rgba(217, 155, 38, 0.6);
      --node-muted-bg: rgba(255, 255, 255, 0.035);
      --node-muted-border: rgba(255, 255, 255, 0.16);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(217, 155, 38, 0.07) 0%, rgba(36, 64, 51, 0.09) 36%, transparent 72%),
        radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    /* Outer Constellation Stage */
    .system-stage {
      position: relative;
      width: min(92vw, 590px);
      height: min(92vw, 590px);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto;
    }

    /* Orbital Track Hairlines */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
    }

    /* Primary track aligned exactly with the 39% radius orbit */
    .orbit-ring-primary {
      width: 78%;
      height: 78%;
      border: 1px dashed var(--orbit-line);
      animation: slowSpin 240s linear infinite;
    }

    .orbit-ring-ambient {
      width: 98%;
      height: 98%;
      border: 1px solid rgba(255, 255, 255, 0.025);
    }

    @keyframes slowSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Central Sun / Core Brand Monolith */
    .system-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 60%;
      max-width: 300px;
      padding: 8px;
    }

    /* Architectural Brand Mark */
    .brand-mark {
      width: clamp(52px, 11vw, 66px);
      height: clamp(52px, 11vw, 66px);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 35px rgba(217, 155, 38, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    }

    .brand-mark:hover {
      transform: scale(1.05);
      border-color: rgba(217, 155, 38, 0.4);
    }

    .brand-mark svg {
      width: 60%;
      height: 60%;
      display: block;
    }

    /* Master Brand Title */
    .brand-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(1.45rem, 4vw, 1.95rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    /* Single-Line Proposition */
    .brand-tagline {
      font-size: clamp(0.70rem, 2vw, 0.85rem);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      white-space: nowrap;
      margin-bottom: 16px;
    }

    /* Minimal Mail Icon Button (Starts email to team@) */
    .mail-icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mail-icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--gold);
      color: #ffffff;
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4), 0 0 18px var(--gold-glow);
    }

    .mail-icon-btn:active {
      transform: scale(0.96);
    }

    .mail-icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Planetary Orbit Nodes (Generous negative space) */
    .planet-node {
      position: absolute;
      width: clamp(76px, 18.5vw, 98px);
      height: clamp(76px, 18.5vw, 98px);
      border-radius: 50%;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 12px;
      text-decoration: none;
      z-index: 15;
      transform: translate(-50%, -50%);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .planet-label {
      font-size: clamp(0.58rem, 1.4vw, 0.69rem);
      font-weight: 500;
      letter-spacing: 0.05em;
      line-height: 1.35;
      text-transform: uppercase;
      user-select: none;
    }

    /* -------------------------------------------------------------
       1. ACTIVE HERO NODE: CLUB HOUSE (Bookable via Airbnb)
    ------------------------------------------------------------- */
    .planet-active {
      background: var(--node-active-bg);
      border: 1.5px solid var(--node-active-border);
      color: #ffffff;
      opacity: 1;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.42), 0 0 22px rgba(217, 155, 38, 0.14);
    }

    .planet-active .planet-label {
      font-weight: 600;
      color: #ffffff;
    }

    .planet-active:hover {
      background: rgba(255, 255, 255, 0.10);
      border-color: var(--gold);
      transform: translate(-50%, -50%) scale(1.08);
      box-shadow: 0 14px 34px rgba(0, 0, 0, 0.55), 0 0 28px var(--gold-glow);
    }

    .planet-active:active {
      transform: translate(-50%, -50%) scale(0.98);
    }

    /* Airbnb Bélo Badge (Brand Color Palette: Pollinator Gold) */
    .airbnb-badge {
      position: absolute;
      top: -3px;
      right: -3px;
      width: 25px;
      height: 25px;
      border-radius: 50%;
      background: #121316;
      border: 1px solid rgba(217, 155, 38, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: all 0.25s ease;
      color: var(--gold);
    }

    .planet-active:hover .airbnb-badge {
      border-color: var(--gold);
      transform: scale(1.1);
      box-shadow: 0 6px 14px rgba(217, 155, 38, 0.4);
      background: #181a1e;
    }

    .airbnb-badge svg {
      width: 14px;
      height: 14px;
      fill: currentColor;
    }

    /* -------------------------------------------------------------
       2. BRIGHTENED UPCOMING NODES (Visible & Readable)
    ------------------------------------------------------------- */
    .planet-muted {
      background: var(--node-muted-bg);
      border: 1px solid var(--node-muted-border);
      color: rgba(255, 255, 255, 0.72);
      opacity: 0.58;
      cursor: pointer;
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.28);
    }

    .planet-muted .planet-label {
      color: rgba(255, 255, 255, 0.72);
      transition: color 0.25s ease;
    }

    /* Brightened hover state (stays grey-ish, gentle lift) */
    .planet-muted:hover {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.36);
      color: #ffffff;
      opacity: 0.88;
      transform: translate(-50%, -50%) scale(1.04);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
    }

    .planet-muted:hover .planet-label {
      color: #ffffff;
    }

    .planet-muted:active {
      transform: translate(-50%, -50%) scale(0.98);
    }

    /* 
      Trigonometric Coordinates for 5 Planets at 39% radius:
      Angle 0: Top (-90°)              -> x=50.0%,  y=11.0%
      Angle 1: Top-Right (-18°)        -> x=87.1%,  y=37.9%
      Angle 2: Bottom-Right (+54°)     -> x=72.9%,  y=81.6%
      Angle 3: Bottom-Left (+126°)     -> x=27.1%,  y=81.6%
      Angle 4: Top-Left (+198°)        -> x=12.9%,  y=37.9%
    */
    .planet-rooftop {
      top: 11%;
      left: 50%;
    }

    .planet-clubhouse {
      top: 37.9%;
      left: 87.1%;
    }

    .planet-workshop {
      top: 81.6%;
      left: 72.9%;
    }

    .planet-apartment {
      top: 81.6%;
      left: 27.1%;
    }

    .planet-greenehouse {
      top: 37.9%;
      left: 12.9%;
    }

    /* Subtle Bottom Copyright */
    .site-footer {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #ffffff;
      color: #0b0c0e;
      padding: 11px 22px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.active {
      transform: translateX(-50%) translateY(0);
    }

    /* Very small mobile screens */
    @media (max-width: 400px) {
      .system-stage {
        width: 96vw;
        height: 96vw;
      }
      .brand-title {
        font-size: 1.35rem;
      }
      .brand-tagline {
        font-size: 0.66rem;
      }
      .planet-node {
        padding: 8px;
      }
      .planet-label {
        font-size: 0.55rem;
      }
      .airbnb-badge {
        width: 21px;
        height: 21px;
      }
      .airbnb-badge svg {
        width: 12px;
        height: 12px;
      }
    }
  </style>
</head>
<body>

  <div class="system-stage">

    <!-- Orbital Hairline Rings -->
    <div class="orbit-ring orbit-ring-ambient" aria-hidden="true"></div>
    <div class="orbit-ring orbit-ring-primary" aria-hidden="true"></div>

    <!-- Center Sun / Hub -->
    <div class="system-center">
      <!-- Logo Mark -->
      <div class="brand-mark" title="New Bern Collection">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Upper triangle: Pollinator Gold -->
          <polygon points="10,10 87,10 10,87" fill="#D99B26" />
          <!-- Lower triangle: Canopy Green -->
          <polygon points="90,90 13,90 90,13" fill="#244033" />
        </svg>
      </div>

      <!-- Title & Proposition on One Line -->
      <h1 class="brand-title">New Bern Collection</h1>
      <p class="brand-tagline">Live, work and play in Downtown Raleigh.</p>

      <!-- Minimal Mail Icon Action -->
      <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20New%20Bern%20Collection" 
         onclick="handleEmailClick(event)" 
         class="mail-icon-btn" 
         title="Email team@newberncollection.com" 
         aria-label="Email team@newberncollection.com">
        <svg viewBox="0 0 24 24">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      </a>
    </div>

    <!-- The Five Orbital Satellites / Planets -->

    <!-- 1. The Rooftop (Top Apex - Brightened) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20The%20Rooftop" 
       onclick="handleMutedClick(event, 'The Rooftop')" 
       class="planet-node planet-muted planet-rooftop" 
       title="The Rooftop — Booking Coming Soon">
      <span class="planet-label">The<br>Rooftop</span>
    </a>

    <!-- 2. Club House (Top Right - ACTIVE HERO NODE with Pollinator Gold Airbnb Bélo Badge) -->
    <a href="https://www.airbnb.com" 
       id="clubHouseLink"
       target="_blank" 
       rel="noopener noreferrer"
       onclick="handleClubHouseClick(event)" 
       class="planet-node planet-active planet-clubhouse" 
       title="Club House — Book on Airbnb">
      <span class="planet-label">Club<br>House</span>
      <!-- Airbnb Bélo Icon Badge in Brand Pollinator Gold -->
      <div class="airbnb-badge" title="Book on Airbnb" aria-hidden="true">
        <svg viewBox="0 0 24 24">
          <path d="M12.001 18.275c-1.353-1.697-2.148-3.184-2.413-4.457-.263-1.027-.16-1.848.291-2.465.477-.71 1.188-1.056 2.121-1.056s1.643.345 2.12 1.063c.446.61.558 1.432.286 2.465-.291 1.298-1.085 2.785-2.412 4.458zm9.601 1.14c-.185 1.246-1.034 2.28-2.2 2.783-2.253.98-4.483-.583-6.392-2.704 3.157-3.951 3.74-7.028 2.385-9.018-.795-1.14-1.933-1.695-3.394-1.695-2.944 0-4.563 2.49-3.927 5.382.37 1.565 1.352 3.343 2.917 5.332-.98 1.085-1.91 1.856-2.732 2.333-.636.344-1.245.558-1.828.609-2.679.399-4.778-2.2-3.825-4.88.132-.345.395-.98.845-1.961l.025-.053c1.464-3.178 3.242-6.79 5.285-10.795l.053-.132.58-1.116c.45-.822.635-1.19 1.351-1.643.346-.21.77-.315 1.246-.315.954 0 1.698.558 2.016 1.007.158.239.345.557.582.953l.558 1.089.08.159c2.041 4.004 3.821 7.608 5.279 10.794l.026.025.533 1.22.318.764c.243.613.294 1.222.213 1.858zm1.22-2.39c-.186-.583-.505-1.271-.9-2.094v-.03c-1.889-4.006-3.642-7.608-5.307-10.844l-.111-.163C15.317 1.461 14.468 0 12.001 0c-2.44 0-3.476 1.695-4.535 3.898l-.081.16c-1.669 3.236-3.421 6.843-5.303 10.847v.053l-.559 1.22c-.21.504-.317.768-.345.847C-.172 20.74 2.611 24 5.98 24c.027 0 .132 0 .265-.027h.372c1.75-.213 3.554-1.325 5.384-3.317 1.829 1.989 3.635 3.104 5.382 3.317h.372c.133.027.239.027.265.027 3.37.003 6.152-3.261 4.802-6.975z"/>
        </svg>
      </div>
    </a>

    <!-- 3. The Workshop (Bottom Right - Brightened) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20The%20Workshop" 
       onclick="handleMutedClick(event, 'The Workshop')" 
       class="planet-node planet-muted planet-workshop" 
       title="The Workshop — Booking Coming Soon">
      <span class="planet-label">The<br>Workshop</span>
    </a>

    <!-- 4. The Apartment (Bottom Left - Brightened) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20The%20Apartment" 
       onclick="handleMutedClick(event, 'The Apartment')" 
       class="planet-node planet-muted planet-apartment" 
       title="The Apartment — Booking Coming Soon">
      <span class="planet-label">The<br>Apartment</span>
    </a>

    <!-- 5. Greene House (Top Left - Brightened) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20Greene%20House" 
       onclick="handleMutedClick(event, 'Greene House')" 
       class="planet-node planet-muted planet-greenehouse" 
       title="Greene House — Booking Coming Soon">
      <span class="planet-label">Greene<br>House</span>
    </a>

  </div>

  <!-- Minimal Footer -->
  <footer class="site-footer">
    <span>&copy; 2026 New Bern Collection LLC</span>
  </footer>

  <div id="toast">Starting email to team@newberncollection.com</div>

  <script>
    const email = 'team@newberncollection.com';

    // Airbnb listing URL for Club House (replace with specific listing ID whenever ready)
    const AIRBNB_CLUBHOUSE_URL = 'https://www.airbnb.com';

    document.getElementById('clubHouseLink').setAttribute('href', AIRBNB_CLUBHOUSE_URL);

    // Center Mail Icon: Starts email to team@ and copies address
    function handleEmailClick(e) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).catch(() => {});
      }
      showToast('Opening email: team@newberncollection.com');
      window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent('Inquiry — New Bern Collection');
    }

    // Active Club House Click: Redirects to Airbnb
    function handleClubHouseClick(e) {
      showToast('Redirecting to Club House on Airbnb...');
    }

    // Upcoming Spaces: Informs user booking is coming soon and offers 1:1 email inquiry
    function handleMutedClick(e, placeName) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).catch(() => {});
      }
      showToast(`${placeName} booking opening soon — opening email to team@`);
      window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent('Booking Inquiry — ' + placeName);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('active');
      setTimeout(() => {
        toast.classList.remove('active');
      }, 2600);
    }
  </script>
</body>
</html>
