<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>New Bern Collection — Downtown Raleigh</title>
  <meta name="description" content="New Bern Collection — Live, work and play in Downtown Raleigh." />
  <meta property="og:title" content="New Bern Collection" />
  <meta property="og:description" content="Live, work and play in Downtown Raleigh." />
  <meta property="og:url" content="https://newberncollection.com" />
  <meta name="twitter:card" content="summary" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0b0c0e;
      --gold: #D99B26;
      --gold-glow: rgba(217, 155, 38, 0.22);
      --green: #244033;
      --text: #ffffff;
      --text-muted: #9aa0a6;
      --text-dim: #5f6368;
      --orbit-line: rgba(255, 255, 255, 0.08);
      --node-bg: rgba(255, 255, 255, 0.035);
      --node-border: rgba(255, 255, 255, 0.12);
      --node-hover-bg: rgba(255, 255, 255, 0.07);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 50%, rgba(217, 155, 38, 0.07) 0%, rgba(36, 64, 51, 0.09) 36%, transparent 72%),
        radial-gradient(circle at 50% 10%, rgba(255, 255, 255, 0.02) 0%, transparent 60%);
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
      position: relative;
    }

    /* Outer Constellation Stage */
    .system-stage {
      position: relative;
      width: min(92vw, 560px);
      height: min(92vw, 560px);
      display: flex;
      justify-content: center;
      align-items: center;
      margin: auto;
    }

    /* Orbital Track Hairlines */
    .orbit-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      border-radius: 50%;
      pointer-events: none;
    }

    .orbit-ring-primary {
      width: 76%;
      height: 76%;
      border: 1px dashed var(--orbit-line);
      animation: slowSpin 240s linear infinite;
    }

    .orbit-ring-ambient {
      width: 96%;
      height: 96%;
      border: 1px solid rgba(255, 255, 255, 0.03);
    }

    @keyframes slowSpin {
      from { transform: translate(-50%, -50%) rotate(0deg); }
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }

    /* Central Sun / Core Brand Monolith */
    .system-center {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      width: 64%;
      max-width: 320px;
      padding: 10px;
    }

    /* Architectural Brand Mark */
    .brand-mark {
      width: clamp(52px, 12vw, 68px);
      height: clamp(52px, 12vw, 68px);
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4), 0 0 35px rgba(217, 155, 38, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s ease;
    }

    .brand-mark:hover {
      transform: scale(1.05);
      border-color: rgba(217, 155, 38, 0.4);
    }

    .brand-mark svg {
      width: 60%;
      height: 60%;
      display: block;
    }

    /* Master Brand Title */
    .brand-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: clamp(1.45rem, 4.4vw, 1.95rem);
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 8px;
      white-space: nowrap;
    }

    /* Single-Line Proposition */
    .brand-tagline {
      font-size: clamp(0.72rem, 2.2vw, 0.88rem);
      font-weight: 500;
      color: var(--text-muted);
      letter-spacing: 0.01em;
      white-space: nowrap;
      margin-bottom: 18px;
    }

    /* Minimal Mail Icon Button (Starts email to team@) */
    .mail-icon-btn {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.14);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .mail-icon-btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: var(--gold);
      color: #ffffff;
      transform: scale(1.08) translateY(-2px);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4), 0 0 18px var(--gold-glow);
    }

    .mail-icon-btn:active {
      transform: scale(0.96);
    }

    .mail-icon-btn svg {
      width: 19px;
      height: 19px;
      stroke: currentColor;
      stroke-width: 1.75;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* Five Planetary Orbit Nodes */
    .planet-node {
      position: absolute;
      width: clamp(66px, 16vw, 84px);
      height: clamp(66px, 16vw, 84px);
      border-radius: 50%;
      background: var(--node-bg);
      border: 1px solid var(--node-border);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 6px;
      text-decoration: none;
      color: var(--text);
      cursor: pointer;
      z-index: 15;
      transform: translate(-50%, -50%);
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .planet-node:hover {
      background: var(--node-hover-bg);
      border-color: var(--gold);
      transform: translate(-50%, -50%) scale(1.09);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.45), 0 0 22px var(--gold-glow);
    }

    .planet-node:active {
      transform: translate(-50%, -50%) scale(0.98);
    }

    .planet-label {
      font-size: clamp(0.66rem, 1.8vw, 0.78rem);
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.22;
      color: var(--text);
      user-select: none;
    }

    /* 
      Trigonometric Coordinates for 5 Planets at 38% radius:
      Angle 0: Top (-90°)              -> x=50%,    y=12%
      Angle 1: Top-Right (-18°)        -> x=86.1%,  y=38.3%
      Angle 2: Bottom-Right (+54°)     -> x=72.3%,  y=80.7%
      Angle 3: Bottom-Left (+126°)     -> x=27.7%,  y=80.7%
      Angle 4: Top-Left (+198°)        -> x=13.9%,  y=38.3%
    */
    .planet-rooftop {
      top: 12%;
      left: 50%;
    }

    .planet-clubhouse {
      top: 38.3%;
      left: 86.1%;
    }

    .planet-workshop {
      top: 80.7%;
      left: 72.3%;
    }

    .planet-apartment {
      top: 80.7%;
      left: 27.7%;
    }

    .planet-greenehouse {
      top: 38.3%;
      left: 13.9%;
    }

    /* Subtle Bottom Copyright */
    .site-footer {
      position: absolute;
      bottom: 16px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 0.72rem;
      color: var(--text-dim);
      letter-spacing: 0.04em;
      white-space: nowrap;
      pointer-events: none;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #ffffff;
      color: #0b0c0e;
      padding: 11px 22px;
      border-radius: 9999px;
      font-size: 0.82rem;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.active {
      transform: translateX(-50%) translateY(0);
    }

    /* Very small screens adjustment */
    @media (max-width: 400px) {
      .system-stage {
        width: 95vw;
        height: 95vw;
      }
      .brand-title {
        font-size: 1.35rem;
      }
      .brand-tagline {
        font-size: 0.68rem;
      }
      .planet-label {
        font-size: 0.62rem;
      }
    }
  </style>
</head>
<body>

  <div class="system-stage">

    <!-- Orbital Hairline Rings -->
    <div class="orbit-ring orbit-ring-ambient" aria-hidden="true"></div>
    <div class="orbit-ring orbit-ring-primary" aria-hidden="true"></div>

    <!-- Center Sun / Hub -->
    <div class="system-center">
      <!-- Logo Mark -->
      <div class="brand-mark" title="New Bern Collection">
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Upper triangle: Pollinator Gold -->
          <polygon points="10,10 87,10 10,87" fill="#D99B26" />
          <!-- Lower triangle: Canopy Green -->
          <polygon points="90,90 13,90 90,13" fill="#244033" />
        </svg>
      </div>

      <!-- Title & Proposition on One Line -->
      <h1 class="brand-title">New Bern Collection</h1>
      <p class="brand-tagline">Live, work and play in Downtown Raleigh.</p>

      <!-- Minimal Mail Icon Action -->
      <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20New%20Bern%20Collection" 
         onclick="handleEmailClick(event)" 
         class="mail-icon-btn" 
         title="Email team@newberncollection.com" 
         aria-label="Email team@newberncollection.com">
        <svg viewBox="0 0 24 24">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      </a>
    </div>

    <!-- The Five Orbital Satellites / Planets -->
    <!-- 1. The Rooftop (Top Apex) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20The%20Rooftop" 
       onclick="handlePlanetClick(event, 'The Rooftop')" 
       class="planet-node planet-rooftop" 
       title="The Rooftop — Inquire / Book">
      <span class="planet-label">The<br>Rooftop</span>
    </a>

    <!-- 2. Club House (Top Right) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20Club%20House" 
       onclick="handlePlanetClick(event, 'Club House')" 
       class="planet-node planet-clubhouse" 
       title="Club House — Inquire / Book">
      <span class="planet-label">Club<br>House</span>
    </a>

    <!-- 3. The Workshop (Bottom Right) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20The%20Workshop" 
       onclick="handlePlanetClick(event, 'The Workshop')" 
       class="planet-node planet-workshop" 
       title="The Workshop — Inquire / Book">
      <span class="planet-label">The<br>Workshop</span>
    </a>

    <!-- 4. The Apartment (Bottom Left) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20The%20Apartment" 
       onclick="handlePlanetClick(event, 'The Apartment')" 
       class="planet-node planet-apartment" 
       title="The Apartment — Inquire / Book">
      <span class="planet-label">The<br>Apartment</span>
    </a>

    <!-- 5. Greene House (Top Left) -->
    <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20Greene%20House" 
       onclick="handlePlanetClick(event, 'Greene House')" 
       class="planet-node planet-greenehouse" 
       title="Greene House — Inquire / Book">
      <span class="planet-label">Greene<br>House</span>
    </a>

  </div>

  <!-- Minimal Footer -->
  <footer class="site-footer">
    <span>&copy; 2026 New Bern Collection LLC</span>
  </footer>

  <div id="toast">Starting email to team@newberncollection.com</div>

  <script>
    const email = 'team@newberncollection.com';

    // Center Mail Icon: Starts email to team@ and copies to clipboard
    function handleEmailClick(e) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).catch(() => {});
      }
      showToast('Opening email: team@newberncollection.com');
      window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent('Inquiry — New Bern Collection');
    }

    // Planet Click: Launches 1:1 inquiry for that specific space & copies team@
    function handlePlanetClick(e, placeName) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).catch(() => {});
      }
      showToast(`Inquiring about ${placeName} — opening email to team@`);
      window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent('Booking Inquiry — ' + placeName);
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('active');
      setTimeout(() => {
        toast.classList.remove('active');
      }, 2600);
    }
  </script>
</body>
</html>
