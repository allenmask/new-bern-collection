<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>New Bern Collection — Downtown Raleigh</title>
  <meta name="description" content="New Bern Collection — Modern life, work, and play in Downtown Raleigh." />
  <meta property="og:title" content="New Bern Collection" />
  <meta property="og:description" content="Modern life, work, and play in Downtown Raleigh." />
  <meta property="og:url" content="https://newberncollection.com" />
  <meta name="twitter:card" content="summary" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
  <link rel="alternate icon" href="assets/favicon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400..600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0c0d10;
      --bg-ambient: radial-gradient(circle at 50% 0%, #151d19 0%, #0c0d10 70%);
      --card-bg: rgba(255, 255, 255, 0.05);
      --card-border: rgba(255, 255, 255, 0.09);
      --card-hover: rgba(255, 255, 255, 0.09);
      --card-active: rgba(255, 255, 255, 0.13);
      --text: #ffffff;
      --text-muted: #9499a6;
      --text-dim: #646a79;
      --accent-gold: #D99B26;
      --accent-green: #244033;
      --badge-bg: rgba(255, 255, 255, 0.07);
      --badge-border: rgba(255, 255, 255, 0.12);
      --icon-bg: rgba(255, 255, 255, 0.07);
      --icon-hover: rgba(255, 255, 255, 0.15);
      --shadow-card: 0 8px 30px rgba(0, 0, 0, 0.35);
      --radius: 20px;
      --radius-sm: 14px;
      --radius-pill: 9999px;
    }

    [data-theme="light"] {
      --bg: #f8f8f6;
      --bg-ambient: radial-gradient(circle at 50% 0%, #eaece8 0%, #f8f8f6 70%);
      --card-bg: #ffffff;
      --card-border: rgba(0, 0, 0, 0.08);
      --card-hover: #fafaf8;
      --card-active: #f1f2ee;
      --text: #161718;
      --text-muted: #64748b;
      --text-dim: #94a3b8;
      --badge-bg: rgba(0, 0, 0, 0.05);
      --badge-border: rgba(0, 0, 0, 0.08);
      --icon-bg: #f1f3ef;
      --icon-hover: #e6e9e3;
      --shadow-card: 0 6px 24px rgba(0, 0, 0, 0.06);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      background-image: var(--bg-ambient);
      background-attachment: fixed;
      color: var(--text);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 18px;
      transition: background 0.3s ease, color 0.3s ease;
    }

    .container-wrapper {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      margin: auto;
    }

    /* Top Utility Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
    }

    .brand-pill {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: var(--radius-pill);
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-muted);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .top-actions {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
    }

    .btn-icon {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      transition: all 0.2s ease;
    }

    .btn-icon:hover {
      background: var(--icon-hover);
      transform: scale(1.05);
    }

    /* Main Card Hero */
    .hero-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      box-shadow: var(--shadow-card);
      padding: 44px 28px 36px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .hero-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
    }

    /* Architectural Logo Mark */
    .logo-container {
      width: 80px;
      height: 80px;
      border-radius: 20px;
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .hero-card:hover .logo-container {
      transform: scale(1.04);
    }

    .logo-svg {
      width: 48px;
      height: 48px;
      display: block;
    }

    /* Typography */
    .brand-title {
      font-family: 'Newsreader', Georgia, serif;
      font-size: 2.1rem;
      font-weight: 500;
      letter-spacing: -0.02em;
      color: var(--text);
      line-height: 1.15;
      margin-bottom: 12px;
    }

    .brand-description {
      font-size: 1rem;
      font-weight: 500;
      line-height: 1.5;
      color: var(--text-muted);
      max-width: 320px;
      margin-bottom: 32px;
    }

    /* Contact / Inquiries Button */
    .contact-card {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      padding: 14px 22px;
      border-radius: var(--radius-pill);
      background: var(--badge-bg);
      border: 1px solid var(--badge-border);
      color: var(--text);
      text-decoration: none;
      font-size: 0.92rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
    }

    .contact-card:hover {
      background: var(--card-hover);
      border-color: var(--card-active);
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    .contact-card:active {
      transform: scale(0.98);
    }

    .icon-mail {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      stroke-width: 2;
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      flex-shrink: 0;
    }

    /* Footer */
    .site-footer {
      text-align: center;
      padding: 4px 0 0;
    }

    .footer-text {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--text-dim);
      letter-spacing: 0.02em;
      text-decoration: none;
    }

    /* Toast Notification */
    #toast {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text);
      color: var(--bg);
      padding: 12px 22px;
      border-radius: var(--radius-pill);
      font-size: 0.85rem;
      font-weight: 600;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 999;
      pointer-events: none;
      white-space: nowrap;
    }

    #toast.active {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 480px) {
      .hero-card {
        padding: 38px 20px 30px;
      }
      .brand-title {
        font-size: 1.85rem;
      }
      .brand-description {
        font-size: 0.94rem;
      }
    }
  </style>
</head>
<body>

  <div class="container-wrapper">

    <!-- Top Utility Bar -->
    <div class="top-bar">
      <div class="brand-pill">
        <span>Raleigh, NC</span>
      </div>

      <div class="top-actions">
        <button class="btn-icon" id="shareBtn" title="Share" aria-label="Share">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"></circle><circle cx="6" cy="12" r="3"></circle><circle cx="18" cy="19" r="3"></circle><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line></svg>
        </button>
        <button class="btn-icon" id="themeToggle" title="Toggle Theme" aria-label="Theme">
          <svg id="moonIcon" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
          <svg id="sunIcon" style="display:none;" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        </button>
      </div>
    </div>

    <!-- Centered Hero Card -->
    <div class="hero-card">
      
      <!-- Architectural Brand Mark -->
      <div class="logo-container" title="New Bern Collection">
        <svg class="logo-svg" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Upper triangle: Pollinator Gold -->
          <polygon points="10,10 87,10 10,87" fill="#D99B26" />
          <!-- Lower triangle: Canopy Green -->
          <polygon points="90,90 13,90 90,13" fill="#244033" />
        </svg>
      </div>

      <!-- Title & Proposition -->
      <h1 class="brand-title">New Bern Collection</h1>
      <p class="brand-description">Modern life, work, and play in Downtown Raleigh.</p>

      <!-- Mail Contact Action -->
      <a href="mailto:team@newberncollection.com?subject=Inquiry%20%E2%80%94%20New%20Bern%20Collection" onclick="handleEmailClick(event)" class="contact-card" title="team@newberncollection.com">
        <svg class="icon-mail" viewBox="0 0 24 24">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
        <span>team@newberncollection.com</span>
      </a>

    </div>

    <!-- Footer -->
    <div class="site-footer">
      <span class="footer-text">&copy; 2026 New Bern Collection LLC</span>
    </div>

  </div>

  <div id="toast">team@newberncollection.com copied to clipboard!</div>

  <script>
    // Theme Toggle
    const toggleBtn = document.getElementById('themeToggle');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');

    const savedTheme = localStorage.getItem('nbc_theme') || 'dark';
    setTheme(savedTheme);

    toggleBtn.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
      setTheme(current === 'dark' ? 'light' : 'dark');
    });

    function setTheme(theme) {
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        moonIcon.style.display = 'block';
        sunIcon.style.display = 'none';
      } else {
        document.documentElement.setAttribute('data-theme', 'dark');
        moonIcon.style.display = 'none';
        sunIcon.style.display = 'block';
      }
      localStorage.setItem('nbc_theme', theme);
    }

    // Email Click: Launch Compose & Copy to Clipboard
    function handleEmailClick(e) {
      const email = 'team@newberncollection.com';
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(email).catch(() => {});
      }
      showToast('team@newberncollection.com copied to clipboard!');
      // Explicit mailto trigger
      window.location.href = 'mailto:' + email + '?subject=' + encodeURIComponent('Inquiry — New Bern Collection');
    }

    // Share action
    document.getElementById('shareBtn').addEventListener('click', async () => {
      if (navigator.share) {
        try {
          await navigator.share({
            title: 'New Bern Collection',
            text: 'Modern life, work, and play in Downtown Raleigh.',
            url: window.location.href,
          });
        } catch (err) {}
      } else {
        navigator.clipboard.writeText(window.location.href);
        showToast('Link copied to clipboard!');
      }
    });

    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('active');
      setTimeout(() => {
        toast.classList.remove('active');
      }, 2500);
    }
  </script>
</body>
</html>
